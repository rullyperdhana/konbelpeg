services:
  # ==========================================
  # PHP 8.4-FPM Laravel Application
  # ==========================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: konbelpeg-app
    restart: unless-stopped
    working_dir: /var/www
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=3306
    volumes:
      - app_storage:/var/www/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - konbelpeg-net

  # ==========================================
  # Nginx Web Server
  # ==========================================
  webserver:
    image: nginx:alpine
    container_name: konbelpeg-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./public:/var/www/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - app_storage:/var/www/storage:ro
    depends_on:
      - app
    networks:
      - konbelpeg-net

  # ==========================================
  # MySQL 8.0 Database Server
  # ==========================================
  db:
    image: mysql:8.0
    container_name: konbelpeg-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-konbelpeg}
      MYSQL_USER: ${DB_USERNAME:-konbelpeg_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret123}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret123}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootsecret123}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - konbelpeg-net

# ==========================================
# Volumes & Networks Definitions
# ==========================================
volumes:
  db_data:
    driver: local
  app_storage:
    driver: local

networks:
  konbelpeg-net:
    driver: bridge
